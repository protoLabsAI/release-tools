name: Release

# Tags + publishes on `chore: release vX.Y.Z` commits to main, or manual
# dispatch. Fully idempotent: re-running on a commit whose tag already
# exists and whose version is already on npm is a no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  release:
    name: Tag + publish
    # workspace-config: allow-hosted-runner npm publish --provenance requires hosted OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.repository == 'protoLabsAI/release-tools' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'chore: release v'))

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # NO `registry-url:` — deliberately. It makes setup-node write an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` AND export NODE_AUTH_TOKEN as
      # the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then authenticates with that
      # placeholder and the registry answers `E404` on PUT (its auth-failure shape) — which
      # is what failed both v2.5.0 attempts, and why simply removing the token from the
      # publish step changed nothing: setup-node had already put one in the environment.
      #
      # package.json's publishConfig already pins
      # {"access":"public","registry":"https://registry.npmjs.org/"}, so registry-url bought
      # nothing here except the broken auth. Without it there is no authToken in play and
      # npm >= 11.5.1 performs the OIDC trusted-publisher exchange.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Tokenless OIDC Trusted Publishing requires npm >= 11.5.1. Node 20 ships
      # npm 10.x, which silently falls back to (placeholder) token auth and
      # 404s against the registry. Pin npm 11 (not @latest): npm 12 dropped
      # Node 20 support (EBADENGINE — broke the v2.4.1 cut), and 11.x is the
      # known-good line for this publish path.
      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@11

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Idempotent guards. Tag and npm registry are independent — re-runs
          # may need to do one without the other (e.g. tag succeeded last time
          # but the npm OIDC exchange transiently failed).
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — will skip the tag step."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # `npm view` exits non-zero with a noisy E404 when the package or
          # version doesn't exist; suppress so the conditional below stays
          # readable.
          if npm view "@protolabsai/release-tools@$VERSION" version \
            >/dev/null 2>&1; then
            echo "npm_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm — will skip publish."
          else
            echo "npm_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          node --check bin/rewrite-release-notes.mjs
          node bin/rewrite-release-notes.mjs --help > /dev/null

      - name: Tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.version.outputs.tag }}"

      # The major alias (vX) is what CONSUMERS pin — every plugin's release.yml calls
      # `release-tools/.github/workflows/plugin-release.yml@v2`. Moving it here, and only
      # here, is what makes that pin mean "the newest vX.Y.Z RELEASE" (the actions/checkout@v4
      # contract) instead of "whatever is on main".
      #
      # It had drifted to exactly that: v2 was hand-moved to main's HEAD, so three unreleased
      # commits — including plugin-release.yml itself and a security remediation — were running
      # in every consumer's release with `secrets: inherit`, and no released version existed
      # that a consumer could pin instead. Automating it removes the hand step that caused it.
      #
      # Not gated on tag_exists: re-running a release should re-align the alias, which is the
      # cheap way to repair a drifted one.
      - name: Move the major alias
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          MAJOR="v$(printf '%s' "${TAG#v}" | cut -d. -f1)"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          # Point at the release COMMIT (peeled), never at another tag object.
          git tag -f -a "$MAJOR" -m "$MAJOR -> $TAG" "$TAG^{commit}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$MAJOR"
          echo "major alias $MAJOR now points at $TAG"

      - name: Publish to npm
        # Auth via org automation token. The package's publishing access allows
        # token bypass of 2FA; OIDC Trusted Publishing was attempted first but
        # the registry-side grant wasn't authorizing, so we use a token.
        # NPM_TOKEN is SELECTED-visibility (empty if this repo isn't in its
        # list) → fall through to the ALL-visibility NPM_PUBLISH_TOKEN.
        # --provenance still signs via id-token. Switch back to tokenless OIDC
        # once the npm trusted-publisher grant is confirmed.
        if: steps.version.outputs.npm_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub release
        # Idempotent on the release's own existence, NOT on tag_exists: a prior
        # run that tagged but failed at publish leaves the tag behind, and
        # gating on tag_exists would then skip the release forever. Create only
        # if it's missing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: Announce on Discord
        # Generate AI release notes from the commit range and post the embed.
        # Gated to a genuine new publish (same guard as the npm step) so
        # idempotent re-runs never double-post. Degrades to a no-op if the
        # webhook secret is absent, so it can never break the tag/publish path.
        if: steps.version.outputs.npm_published != 'true'
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NOTES_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK not set — skipping Discord announce."
            exit 0
          fi
          node bin/rewrite-release-notes.mjs "$TAG" --post-discord
