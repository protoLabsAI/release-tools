name: Plugin Release

# Reusable workflow that tags, creates a GitHub Release with LLM-themed notes,
# and posts to Discord — the fleet release ritual for protoAgent plugin repos
# AND archetype (bundle) repos. Consumers call it from their own thin release.yml:
#
#   jobs:
#     release:
#       uses: protoLabsAI/release-tools/.github/workflows/plugin-release.yml@v2
#       secrets: inherit
#
# The version comes from the repo's manifest `version:` line. The manifest is
# auto-detected — `protoagent.plugin.yaml` (a plugin) wins, else
# `protoagent.bundle.yaml` (an archetype bundle, ADR 0040) — or named with the
# `manifest` input. An archetype release says so in the Discord embed title/footer
# and the GitHub release body; a plugin release is unchanged.
#
# See the README's "Plugin release workflow" section for details.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label for the release job."
        required: false
        type: string
        default: ""
      manifest:
        description: >-
          Manifest to read `version:` from. Default: auto-detect —
          protoagent.plugin.yaml if present (plugin), else protoagent.bundle.yaml
          (archetype bundle).
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Tag + release notes + Discord
    runs-on: ${{ inputs.runner || vars.NSC_RUNNER || 'namespace-profile-protolabs-linux' }}
    timeout-minutes: 10
    # Serialize releases per calling repo: the tag-exists check and the tag push are
    # separate steps, so two near-simultaneous triggers (a `chore: release` push plus a
    # dispatch) could both see exists=false. Queue rather than cancel — a cancelled
    # run mid-release would leave a tag with a placeholder release body.
    concurrency:
      group: plugin-release-${{ github.repository }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve version + previous tag
        id: v
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST="$MANIFEST_INPUT"
          if [ -z "$MANIFEST" ]; then
            if [ -f protoagent.plugin.yaml ]; then
              MANIFEST=protoagent.plugin.yaml
            elif [ -f protoagent.bundle.yaml ]; then
              MANIFEST=protoagent.bundle.yaml
            else
              echo "::error::No protoagent.plugin.yaml or protoagent.bundle.yaml at the repo root — nothing to version."
              exit 1
            fi
          fi
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::manifest '$MANIFEST' does not exist."
            exit 1
          fi
          case "$MANIFEST" in
            *bundle.yaml) KIND=archetype ;;
            *) KIND=plugin ;;
          esac
          # Strip quotes and a trailing comment so `version: "0.7.0"  # note` reads 0.7.0.
          # `|| true`: Actions runs bash with pipefail, and a grep miss must reach the
          # explicit error below rather than exit silently here.
          VERSION=$(grep -E '^version:' "$MANIFEST" | head -1 \
            | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*#.*$//; s/^["'"'"']//; s/["'"'"']$//' || true)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::$MANIFEST has no semver top-level 'version:' line (got '$VERSION') — add e.g. 'version: 0.1.0'."
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO#*/}" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          # Previous = the newest v-tag that sorts BELOW this one — not simply the newest
          # tag: when $TAG already exists (an orphan-tag re-run, below) the newest tag IS
          # $TAG, and diffing it against itself yields empty notes.
          PREV=$( { git tag --list 'v[0-9]*'; echo "$TAG"; } | sort -u -V \
            | awk -v t="$TAG" '$0 == t { print p; exit } { p = $0 }')
          [ -z "$PREV" ] && PREV=$(git rev-list --max-parents=0 HEAD | head -1)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          # Idempotency is per artifact: the tag and the GitHub release are checked
          # separately. A run that pushed the tag but died before (or at)
          # `gh release create` leaves an ORPHAN tag; gating everything on the tag alone
          # made every re-run skip it forever. So a re-run creates whatever is missing,
          # and only a tag WITH a release is a no-op.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already tagged and released — skipping (idempotent re-run)."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::notice::$TAG is tagged but has no GitHub release (orphan tag) — creating the release."
            fi
          fi
          echo "Releasing $KIND $TAG from $MANIFEST (notes from $PREV)"

      - name: Create tag
        if: steps.v.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.v.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # --verify-tag: release the tag that exists (new or orphan), never let gh
          # create a fresh one at the default branch's HEAD.
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Generating release notes…"

      - name: Generate notes + post to Discord
        id: notes
        if: steps.v.outputs.release_exists == 'false'
        uses: protoLabsAI/release-tools@v2
        with:
          version: ${{ steps.v.outputs.tag }}
          previous-version: ${{ steps.v.outputs.prev }}
          # Archetypes say so in the embed; plugins keep the action's defaults
          # ("<repo> <tag>" / "protoLabs · <repo>").
          title: ${{ steps.v.outputs.kind == 'archetype' && format('Archetype · {0} {1}', steps.v.outputs.repo_name, steps.v.outputs.tag) || '' }}
          footer: ${{ steps.v.outputs.kind == 'archetype' && format('protoLabs · archetype · {0}', steps.v.outputs.repo_name) || '' }}
          # Archetypes: the member-pin diff between the tags feeds the notes and is
          # appended as a "Member pins" section (pin bumps ARE an archetype's changes).
          bundle-manifest: ${{ steps.v.outputs.kind == 'archetype' && steps.v.outputs.manifest || '' }}
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

      - name: Set the GitHub release body to the generated notes
        if: steps.v.outputs.release_exists == 'false' && steps.notes.outputs.notes != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
          KIND: ${{ steps.v.outputs.kind }}
          TAG: ${{ steps.v.outputs.tag }}
          REPO_NAME: ${{ steps.v.outputs.repo_name }}
        run: |
          : > .release-notes.md
          if [ "$KIND" = "archetype" ]; then
            printf '_protoAgent archetype release: **%s %s**. Member plugin pins are in `protoagent.bundle.yaml` at this tag._\n\n' \
              "$REPO_NAME" "$TAG" >> .release-notes.md
          fi
          printf '%s' "$NOTES" >> .release-notes.md
          gh release edit "$TAG" --notes-file .release-notes.md
