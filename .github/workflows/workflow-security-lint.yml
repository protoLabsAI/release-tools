# SECURITY: lints .github/workflows/ for the CWE-94 script-injection class
# (untrusted ${{ ... }} in run blocks), unpinned actions, and over-broad tokens.
# Fleet standard (protoLabsAI/release-tools) — adopt it in any repo by copying
# this file, or call it as a reusable workflow:
#
#   jobs:
#     security-lint:
#       uses: protoLabsAI/release-tools/.github/workflows/workflow-security-lint.yml@main
#
# `verify-workspace-config` flags repos missing this workflow.
#
# This is the canonical REUSABLE workflow (`workflow_call` only) — it lints the
# CALLING repo. release-tools does not self-trigger it here: its own workflows
# carry pre-existing findings (3 template-injection in tauri-release.yml, plus
# unpinned-uses / cache-poisoning / artipacked) that must be remediated with the
# release pipeline testable, tracked separately. Self-linting is wired once that
# debt is cleared.
name: Workflow Security Lint

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security-lint:
    runs-on: namespace-profile-protolabs-linux
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # zizmor — GitHub Actions security linter. Installed from PyPI (no
      # third-party action to pin) at an exact version for reproducibility.
      # --min-severity=medium fails the build on script injection, unpinned
      # actions, artipacked (persist-credentials), and token over-privilege.
      - name: Install zizmor
        run: pip install zizmor==1.25.2

      - name: Run zizmor
        run: zizmor --min-severity=medium .github/workflows/

      # actionlint — workflow syntax, expression typing, and shellcheck. Fetched
      # via the official download script pinned to an immutable commit SHA + an
      # exact actionlint version, so the tooling is deterministic.
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/62c50a97a146fe36a8951a2a365158c4a4795ba8/scripts/download-actionlint.bash -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.12

      # SHELLCHECK_OPTS gates only on error-severity shell bugs so adoption isn't
      # blocked by pre-existing info/warning style findings (SC2086 unquoted vars,
      # etc.). Tighten the severity once a repo's run: blocks are cleaned up.
      - name: Run actionlint
        env:
          SHELLCHECK_OPTS: --severity=error
        run: ./actionlint -color
